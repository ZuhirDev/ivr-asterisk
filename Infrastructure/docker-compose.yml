services:
  backend:
    build:
      context: ../Backend
      dockerfile: Dockerfile
    container_name: node-asterisk
    volumes:
      - ../Backend/:/app
    depends_on:
      - asterisk
      - espeak
      - vosk
    ports:
      - "3500:3500"
    networks:
      - asterisk-network
  asterisk:
    build:
      context: ../asterisk
      dockerfile: Dockerfile
    container_name: asterisk
    ports:
      - "5060:5060/udp"
      - "10000-10100:10000-10100/udp"
      - "8088:8088"
    networks:
      - asterisk-network
    volumes:
      - ../asterisk/conf/extensions.conf:/etc/asterisk/extensions.conf
      - ../asterisk/conf/pjsip.conf:/etc/asterisk/pjsip.conf
      - ../asterisk/conf/logger.conf:/etc/asterisk/logger.conf
      - ../asterisk/conf/ari.conf:/etc/asterisk/ari.conf
      - ../asterisk/conf/http.conf:/etc/asterisk/http.conf
      - ../asterisk/conf/rtp.conf:/etc/asterisk/rtp.conf
      - ../espeak/tts:/var/lib/asterisk/sounds/tmp
  espeak:
    build: ../espeak
    container_name: espeak
    volumes:
      - ../espeak/tts:/app/tts
    ports:
      - "5000:5000"
    networks:
      - asterisk-network
  # vosk:
  #   build: ../vosk
  #   container_name: vosk
  #   volumes:
  #     - ../vosk:/app
  #   ports:
  #     - "8000:8000"
  #   networks:
  #     - asterisk-network
  vosk:
    image: alphacep/kaldi-es:latest
    container_name: vosk
    ports:
      - "2700:2700"
    networks:
      - asterisk-network  
    depends_on:
      - asterisk
      - espeak
networks: 
  asterisk-network:
    driver: bridge